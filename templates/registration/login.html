<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Steam Style</title>
    <style>
        body {
            background-color: #1b2838;
            color: #c7d5e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #171a21;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
        }
        h2 {
            color: #ffffff;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2a475e;
            padding-bottom: 10px;
        }
        p {
            font-size: 14px;
        }
        form p {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8f98a0;
            font-size: 12px;
            text-transform: uppercase;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #32353c;
            border: 1px solid #000000;
            color: #ffffff;
            border-radius: 2px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #66c0f4;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #75bdf0 5%, #388bc5 95%);
            border: none;
            color: #ffffff;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover {
            background: linear-gradient(to bottom, #8ae2ff 5%, #4bb4ff 95%);
        }
        .errorlist {
            color: #ff6b6b;
            list-style: none;
            padding: 0;
            font-size: 13px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #66c0f4;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link a:hover {
            text-decoration: underline;
            color: #8ae2ff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign In</h2>
        
        {% if form.errors %}
            <p style="color: #ff6b6b;">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign In</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <div class="back-link">
            <a href="/">&larr; Return to Home</a>
        </div>
    </div>
</body>
</html>
